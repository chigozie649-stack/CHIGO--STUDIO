<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIGO STUDIO</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #1e1b4b, #050811 70%); color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; background: rgba(15, 23, 42, 0.92); border-bottom: 1px solid rgba(139, 92, 246, 0.4); display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 800; background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 15px; }
    .tabs { display: flex; gap: 6px; }
    .tab { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .tab.active { background: linear-gradient(90deg, #2563eb, #7c3aed); color: #fff; border: none; }
    .view { display: none; flex: 1; padding: 14px; flex-direction: column; overflow-y: auto; }
    .view.active { display: flex; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 11px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; }
    button.go { background: linear-gradient(90deg, #3b82f6, #8b5cf6); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    pre { background: #020617; border: 1px solid #1e293b; color: #34d399; padding: 12px; border-radius: 10px; font-size: 12px; white-space: pre-wrap; flex: 1; overflow-y: auto; margin: 0; }
    iframe { width: 100%; height: 100%; border: none; border-radius: 10px; background: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="brand">✦ CHIGO STUDIO</div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('build', this)">Studio</button>
      <button class="tab" onclick="showTab('preview', this)">Live App</button>
      <button class="tab" onclick="showTab('logs', this)">Terminal</button>
    </div>
  </header>

  <div id="build" class="view active">
    <input type="url" id="backendUrl" placeholder="Cloud Backend URL (https://trycloudflare.com)" />
    <input type="password" id="apiKey" placeholder="Paste Gemini API Key" />
    <select id="model">
      <option value="gemini-2.5-pro">Gemini 2.5 Pro (Maximum Accuracy)</option>
      <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fastest)</option>
    </select>
    <textarea id="prompt" rows="4" placeholder="Describe what to build or update in the cloud..."></textarea>
    <button id="btn" class="go" onclick="runBuild()">⚡ Build Automatically</button>
    <div id="status" style="margin-top:12px; color:#c4b5fd; font-size:14px;"></div>
  </div>

  <div id="preview" class="view" style="padding:6px;">
    <iframe id="frame"></iframe>
  </div>

  <div id="logs" class="view">
    <pre id="terminal">Waiting for cloud backend...</pre>
  </div>

  <script>
    const urlInput = document.getElementById('backendUrl');
    const keyInput = document.getElementById('apiKey');
    urlInput.value = localStorage.getItem('cloud_url') || '';
    keyInput.value = localStorage.getItem('gemini_key') || '';

    function showTab(id, el) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
      if (id === 'preview') {
        const base = urlInput.value.trim().replace(/\/+$/, '');
        if (base) document.getElementById('frame').src = base + '/preview/?t=' + Date.now();
      }
    }

    async function runBuild() {
      const base = urlInput.value.trim().replace(/\/+$/, '');
      const apiKey = keyInput.value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const model = document.getElementById('model').value;
      if (!base || !apiKey || !prompt) return alert('Fill in all three boxes.');

      localStorage.setItem('cloud_url', base);
      localStorage.setItem('gemini_key', apiKey);

      const btn = document.getElementById('btn');
      btn.disabled = true; btn.innerText = 'Building in Cloud...';
      document.getElementById('terminal').innerText = 'Running in cloud...\n';

      try {
        const res = await fetch(base + '/build', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, apiKey, model })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          document.getElementById('status').innerText = '❌ ' + (data.error || res.statusText);
          document.getElementById('terminal').innerText = data.error || res.statusText;
        } else {
          document.getElementById('status').innerText = '✅ ' + data.summary;
          document.getElementById('terminal').innerText = Array.isArray(data.logs) ? data.logs.join('\n\n') : String(data.logs);
        }
      } catch (err) {
        document.getElementById('status').innerText = '❌ Could not reach Cloud Backend URL';
        document.getElementById('terminal').innerText = err.message;
      } finally {
        btn.disabled = false; btn.innerText = '⚡ Build Automatically';
      }
    }
  </script>
</body>
</html>
